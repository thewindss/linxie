<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>星槎渡·入君怀</title>
    
    <!-- 1. 必须要在 <head> 和 </head> 中间写 style -->
    <style>
        /* 2. 语法：花括号 {} 不能漏，冒号 : 不能写成等号 =，分号 ; 不能漏 */
        body {
            背景颜色: #f0e6d2; 
            文本对齐: 居中;
            padding-top: 50px;
        }
        h1 {
            color: #8b4513;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <!-- 3. HTML里必须有对应的标签，CSS才能生效 -->
    <h1>星槎渡·入君怀</h1>
    <p>这是我的第一个网页，样式写在这里！</p>
</body>
</html>
