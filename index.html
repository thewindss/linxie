        .video-wrapper {
            width: 100%;
            max-width: 700px;
            height: 390px;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            position: relative;
            transition: box-shadow 0.3s ease;
            text-align: center;
           margin: 40px;
           margin-bottom: 20px;
           margin-top: 20px;
           box-shadow: 0 2px 20px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        /* ========== 视频容器（用于定位按钮） ========== */
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            cursor: pointer;
        }

        /* ========== 视频元素 ========== */
        .video-container video {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
            /* 防止视频加载时闪烁 */
        }

        /* ========== 播放按钮 ========== */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 10;
            /* 保证按钮在视频上方 */
            outline: none;
            /* 移除焦点轮廓 */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* 播放按钮悬停效果 */
        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.12);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        }

        /* 播放按钮点击效果 */
        .play-btn:active {
            transform: translate(-50%, -50%) scale(0.94);
        }

        /* ========== 播放按钮中的三角形图标（纯 CSS） ========== */
        .play-icon {
            width: 0;
            height: 0;
            border-left: 26px solid #1a1a2e;
            border-top: 16px solid transparent;
            border-bottom: 16px solid transparent;
            margin-left: 8px;
            /* 视觉居中微调 */
            transition: all 0.3s ease;
        }

        /* 悬停时图标颜色加深 */
        .play-btn:hover .play-icon {
            border-left-color: #0d0d1a;
        }

        /* ========== 按钮隐藏状态（播放时） ========== */
        .play-btn.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.7);
            pointer-events: none;
            /* 禁止点击 */
            transition: all 0.4s cubic-bezier(0.34, 1.0, 0.64, 1);
        }

        /* ========== 视频底部控制栏（极简风格） ========== */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
            pointer-events: none;
            /* 默认不拦截事件 */
        }

        /* 鼠标悬停在视频上时显示控制栏 */
        .video-container:hover .video-controls {
            opacity: 1;
        }

        /* 控制栏中的小播放/暂停按钮（备选） */
        .ctrl-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
            pointer-events: auto;
            /* 可点击 */
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            flex-shrink: 0;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .ctrl-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        /* 进度条 */
        .progress-bar {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            pointer-events: auto;
            /* 可点击 */
            transition: height 0.2s ease;
        }

        .progress-bar:hover {
            height: 6px;
        }

        .progress-bar .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: #fff;
            transition: width 0.1s linear;
            position: relative;
        }

        /* 进度条上的小圆点 */
        .progress-bar .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        /* 时间显示 */
        .time-display {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
            pointer-events: none;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* ========== 响应式适配 ========== */
        @media (max-width: 600px) {
            .play-btn {
                width: 68px;
                height: 68px;
            }

            .play-icon {
                border-left-width: 20px;
                border-top-width: 12px;
                border-bottom-width: 12px;
                margin-left: 6px;
            }

            .video-controls {
                padding: 10px 14px;
                gap: 10px;
            }

            .ctrl-btn {
                width: 30px;
                height: 30px;
            }

            .ctrl-btn svg {
                width: 14px;
                height: 14px;
            }

            .time-display {
                font-size: 11px;
            }
        }

        @media (max-width: 400px) {
            .play-btn {
                width: 56px;
                height: 56px;
            }

            .play-icon {
                border-left-width: 16px;
                border-top-width: 10px;
                border-bottom-width: 10px;
                margin-left: 4px;
            }
        }

        /* ========== 加载状态提示（可选） ========== */
        .video-container.loading::before {
            content: '加载中...';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 1;
        }

        /* ========== 视频封面占位（无 poster 时显示） ========== */
        .video-container video:not([poster]) {
            background: #111;
        }

        /* ========== 小提示：双击全屏（可选） ========== */
        .fullscreen-hint {
            position: absolute;
            bottom: 60px;
            right: 16px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .video-container:hover .fullscreen-hint {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .fullscreen-hint {
                display: none;
            }
        }

    </style>

</head>

<body>

<div class="all">

<div class="all-bianji">

</div>
  <div class="all-1">
   <!-- ========== 视频播放器 ========== -->
    <div class="video-wrapper">

        <div class="video-container" id="videoContainer">

            <!-- ===== 视频元素 ===== -->
            <!--
                替换视频源：修改 src 属性为你自己的视频地址。
                支持格式：mp4, webm, ogg
                建议提供多个格式以兼容不同浏览器。
                可使用 poster 属性设置视频封面图。
            -->
            <video id="myVideo"
            src="苦巧克力装饰/苦巧克力装饰完稿.mp4"
            preload="metadata"
            playsinline
            >
        </video>

        <!-- ===== 中央播放按钮 ===== -->
        <button class="play-btn" id="playBtn" aria-label="播放视频">
            <span class="play-icon"></span>
        </button>

        <!-- ===== 底部控制栏 ===== -->
        <div class="video-controls" id="videoControls">

            <!-- 小播放/暂停按钮 -->
            <button class="ctrl-btn" id="ctrlPlayBtn" aria-label="播放/暂停">
                <svg viewBox="0 0 24 24">
                    <polygon points="5,3 19,12 5,21" />
                </svg>
            </button>

            <!-- 进度条 -->
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <!-- 时间显示 -->
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        </div>

        <!-- 全屏小提示 -->

<div class="all-bianji">
    <div class="bianjiwor">
        <h1>1:00</h1>
    </div>

</div>


</div>


<script>
    (function() {
        'use strict';

        // ---------- DOM 引用 ----------
        const video = document.getElementById('myVideo');
        const container = document.getElementById('videoContainer');
        const playBtn = document.getElementById('playBtn');
        const ctrlPlayBtn = document.getElementById('ctrlPlayBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const timeDisplay = document.getElementById('timeDisplay');

        // ---------- 状态 ----------
        let isDragging = false; // 是否正在拖动进度条
        let controlsTimeout = null; // 控制栏自动隐藏定时器

        // ---------- 辅助函数 ----------
        // 格式化时间 (秒 → MM:SS)
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        // 更新进度条和时间显示
        function updateProgress() {
            if (!isDragging) {
                const percent = video.duration ? (video.currentTime / video.duration) * 100 : 0;
                progressFill.style.width = percent + '%';
            }
            timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        }

        // 切换播放/暂停
        function togglePlay() {
            if (video.paused) {
                video.play().catch(function(err) {
                    // 自动播放被阻止或其他错误
                    console.warn('播放失败:', err);
                });
            } else {
                video.pause();
            }
        }

        // 更新播放按钮的显示状态
        function updatePlayButton() {
            if (video.paused) {
                // 暂停状态 → 显示播放按钮
                playBtn.classList.remove('hidden');
                // 更新控制栏的小按钮图标为播放
                ctrlPlayBtn.innerHTML = `
                            <svg viewBox="0 0 24 24">
                                <polygon points="5,3 19,12 5,21" />
                            </svg>
                        `;
                ctrlPlayBtn.setAttribute('aria-label', '播放');
            } else {
                // 播放状态 → 隐藏播放按钮
                playBtn.classList.add('hidden');
                // 更新控制栏的小按钮图标为暂停
                ctrlPlayBtn.innerHTML = `
                            <svg viewBox="0 0 24 24">
                                <rect x="6" y="4" width="4" height="16" />
                                <rect x="14" y="4" width="4" height="16" />
                            </svg>
                        `;
                ctrlPlayBtn.setAttribute('aria-label', '暂停');
            }
        }

        // ---------- 事件绑定 ----------

        // 1. 中央大播放按钮 → 切换播放
        playBtn.addEventListener('click', function(e) {
            e.stopPropagation(); // 防止事件冒泡到容器
            togglePlay();
        });

        // 2. 控制栏小按钮 → 切换播放
        ctrlPlayBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            togglePlay();
        });

        // 3. 点击视频容器 → 切换播放
        container.addEventListener('click', function(e) {
            // 如果点击的是控制栏或进度条，不处理
            if (e.target.closest('.video-controls') || e.target.closest('.play-btn')) {
                return;
            }
            togglePlay();
        });

        // 4. 视频播放/暂停事件 → 更新按钮状态
        video.addEventListener('play', function() {
            updatePlayButton();
            // 播放时隐藏控制栏（短暂延迟后）
            clearTimeout(controlsTimeout);
            controlsTimeout = setTimeout(function() {
                // 但鼠标悬停时还是会显示
            }, 2000);
        });

        video.addEventListener('pause', function() {
            updatePlayButton();
        });

        // 5. 视频结束 → 重置
        video.addEventListener('ended', function() {
            // 显示播放按钮，允许重新播放
            playBtn.classList.remove('hidden');
            updatePlayButton();
            // 进度条归零
            progressFill.style.width = '0%';
            timeDisplay.textContent = '0:00 / ' + formatTime(video.duration);
        });

        // 6. 视频加载完成（元数据加载后）
        video.addEventListener('loadedmetadata', function() {
            updateProgress();
            // 如果视频时长有效，显示总时长
            if (video.duration && isFinite(video.duration)) {
                timeDisplay.textContent = '0:00 / ' + formatTime(video.duration);
            }
        });

        // 7. 播放进度更新
        video.addEventListener('timeupdate', function() {
            if (!isDragging) {
                updateProgress();
            }
        });

        // 8. 进度条点击 → 跳转
        progressBar.addEventListener('click', function(e) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = percent * video.duration;
                updateProgress();
            }
        });

        // 9. 进度条拖动（鼠标）
        progressBar.addEventListener('mousedown', function(e) {
            isDragging = true;
            // 禁用文本选择
            document.body.style.userSelect = 'none';
            // 立即更新位置
            const rect = progressBar.getBoundingClientRect();
            const percent = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = percent * video.duration;
                progressFill.style.width = percent * 100 + '%';
            }
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const rect = progressBar.getBoundingClientRect();
            let percent = (e.clientX - rect.left) / rect.width;
            percent = Math.min(Math.max(percent, 0), 1);
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = percent * video.duration;
                progressFill.style.width = percent * 100 + '%';
            }
            // 更新时间显示
            timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        });

        document.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                document.body.style.userSelect = '';
                // 确保进度与视频同步
                updateProgress();
            }
        });

        // 10. 进度条拖动（触摸设备）
        progressBar.addEventListener('touchstart', function(e) {
            e.preventDefault();
            isDragging = true;
            const touch = e.touches[0];
            const rect = progressBar.getBoundingClientRect();
            let percent = (touch.clientX - rect.left) / rect.width;
            percent = Math.min(Math.max(percent, 0), 1);
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = percent * video.duration;
                progressFill.style.width = percent * 100 + '%';
            }
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging) return;
            const touch = e.touches[0];
            const rect = progressBar.getBoundingClientRect();
            let percent = (touch.clientX - rect.left) / rect.width;
            percent = Math.min(Math.max(percent, 0), 1);
            if (video.duration && isFinite(video.duration)) {
                video.currentTime = percent * video.duration;
                progressFill.style.width = percent * 100 + '%';
            }
            timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        }, { passive: true });

        document.addEventListener('touchend', function() {
            if (isDragging) {
                isDragging = false;
                updateProgress();
            }
        });

        // 11. 双击视频 → 全屏
        container.addEventListener('dblclick', function() {
            if (video.requestFullscreen) {
                video.requestFullscreen().catch(function(err) {
                    // 可能被浏览器阻止
                });
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        });

        // 12. 键盘支持：空格键切换播放
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                togglePlay();
            }
        });

        // 13. 视频加载错误处理
        video.addEventListener('error', function() {
            console.warn('视频加载失败，请检查视频源地址是否正确。');
            // 显示一个简单的错误提示
            const errorMsg = document.createElement('div');
            errorMsg.style.cssText = `
                        position: absolute; top: 50%; left: 50%;
                        transform: translate(-50%, -50%);
                        color: rgba(255,255,255,0.6);
                        font-size: 16px;
                        text-align: center;
                        z-index: 3;
                        pointer-events: none;
                        background: rgba(0,0,0,0.7);
                        padding: 20px 30px;
                        border-radius: 12px;
                        backdrop-filter: blur(8px);
                    `;
            errorMsg.textContent = '⚠️ 视频加载失败，请检查视频地址';
            container.appendChild(errorMsg);
        });

        // 14. 页面离开前清理定时器
        window.addEventListener('beforeunload', function() {
            clearTimeout(controlsTimeout);
        });

        // ---------- 初始化 ----------
        // 初始状态：显示播放按钮
        playBtn.classList.remove('hidden');
        updatePlayButton();
        // 如果视频已有时长信息，更新时间显示
        if (video.readyState >= 1) {
            updateProgress();
        }

        console.log('🎬 视频播放器已初始化！');
        console.log('💡 提示：点击中央按钮或视频本身即可播放/暂停。');

    })();
</script>
