<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企划 · 星槎渡</title>
    <style>
        /* ===== 全局重置 & 背景 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(#60b3c8 30%, #f9c9ab);
            color: black;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* ===== 主标题 ===== */
        .main-title {
            text-align: center;
            margin-bottom: 10px;
        }
        .main-title h1 {
            color: antiquewhite;
            font-family: 幼圆, 'Segoe UI', sans-serif;
            font-size: 2.6rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 4px;
            margin-bottom: 4px;
        }
        .main-title h3 {
            color: #2c1a0a;
            font-family: 幼圆, sans-serif;
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 2px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        /* ===== 卡片容器 ===== */
        .all {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f9c9ab;
            max-width: 860px;
            width: 100%;
            padding: 24px 20px 40px;
            margin-top: 20px;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(57, 14, 14, 0.18);
            gap: 32px;
        }

        /* ===== 每个时间块 ===== */
        .time-block {
            width: 100%;
            background: rgba(255, 245, 235, 0.5);
            border-radius: 24px;
            padding: 18px 16px 22px;
            backdrop-filter: blur(2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            transition: transform 0.2s;
        }
        .time-block:hover {
            transform: translateY(-2px);
        }

        .time-header {
            background: #ffffff;
            border-radius: 16px;
            padding: 8px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .time-header h1 {
            color: #9b6d29;
            font-family: 幼圆, sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .time-header .sub-label {
            color: #7a5a2a;
            font-size: 0.95rem;
            font-family: 幼圆, sans-serif;
            font-weight: 300;
            margin-top: -4px;
        }

        /* ===== 视频容器 ===== */
        .video-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            transition: box-shadow 0.3s;
        }
        .video-wrapper:hover {
            box-shadow: 0 12px 44px rgba(0, 0, 0, 0.35);
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        .video-container video {
            display: block;
            width: 100%;
            height: auto;
            background: #0a0a0a;
        }

        /* ===== 中央播放按钮 ===== */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.92);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 10;
            outline: none;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .play-btn:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
        }
        .play-btn:active {
            transform: translate(-50%, -50%) scale(0.92);
        }
        .play-icon {
            width: 0;
            height: 0;
            border-left: 28px solid #1a1a2e;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            margin-left: 10px;
            transition: border-color 0.2s;
        }
        .play-btn:hover .play-icon {
            border-left-color: #0d0d1a;
        }
        .play-btn.hidden {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.6);
            pointer-events: none;
            transition: all 0.35s ease;
        }

        /* ===== 底部控制栏 ===== */
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 14px 18px 16px;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 15;
            pointer-events: none;
        }
        .video-container:hover .video-controls,
        .video-container.playing .video-controls {
            opacity: 1;
        }
        .video-controls button,
        .video-controls .progress-bar {
            pointer-events: auto;
        }

        .ctrl-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
            display: block;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
            min-width: 40px;
        }
        .progress-bar:hover {
            height: 7px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background: #ffffff;
            position: relative;
            transition: width 0.05s linear;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        .time-display {
            color: rgba(255, 255, 255, 0.85);
            font-size: 14px;
            font-weight: 450;
            letter-spacing: 0.2px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            min-width: 90px;
            text-align: right;
        }

        .fullscreen-hint {
            position: absolute;
            bottom: 72px;
            right: 16px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            letter-spacing: 0.4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .video-container:hover .fullscreen-hint {
            opacity: 1;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .play-btn {
                width: 70px;
                height: 70px;
            }
            .play-icon {
                border-left-width: 22px;
                border-top-width: 14px;
                border-bottom-width: 14px;
                margin-left: 8px;
            }
            .video-controls {
                padding: 10px 12px 12px;
                gap: 10px;
            }
            .ctrl-btn {
                width: 32px;
                height: 32px;
            }
            .ctrl-btn svg {
                width: 16px;
                height: 16px;
            }
            .time-display {
                font-size: 12px;
                min-width: 70px;
            }
            .fullscreen-hint {
                display: none;
            }
            .main-title h1 {
                font-size: 2rem;
            }
            .time-header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 420px) {
            .play-btn {
                width: 56px;
                height: 56px;
            }
            .play-icon {
                border-left-width: 18px;
                border-top-width: 12px;
                border-bottom-width: 12px;
                margin-left: 6px;
            }
            .video-controls {
                padding: 8px 8px 10px;
                gap: 6px;
            }
            .time-display {
                font-size: 10px;
                min-width: 60px;
            }
            .all {
                padding: 12px 10px 24px;
            }
            .time-block {
                padding: 12px 8px 16px;
            }
        }

        /* ===== 错误提示 ===== */
        .video-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 15px;
            text-align: center;
            z-index: 25;
            pointer-events: none;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .video-error.show {
            display: block;
        }
    </style>
</head>

<body>

    <!-- ===== 页眉 ===== -->
    <div class="main-title">
        <h1>星槎渡·入君怀</h1>
        <h3>麟邂2026七夕24小时接力 · 企划整理</h3>
    </div>

    <!-- ===== 卡片主体 ===== -->
    <div class="all">

        <!-- ===== 0:00 时间块 ===== -->
        <div class="time-block">
            <div class="time-header">
                <h1>0:00</h1>
                <div class="sub-label">边际 · 手书</div>
            </div>

            <!-- 视频播放器 -->
            <div class="video-wrapper">
                <div class="video-container" id="videoContainer">

                    <!-- 视频元素 -->
                    <video id="myVideo"
                           src="苦巧克力装饰/苦巧克力装饰完稿.mp4"
                           preload="metadata"
                           playsinline
                           poster="https://www.w3schools.com/html/pic_bullwinkle.jpg"
                    >
                        您的浏览器不支持 HTML5 视频。
                    </video>

                    <!-- 中央播放按钮 -->
                    <button class="play-btn" id="playBtn" aria-label="播放视频">
                        <span class="play-icon"></span>
                    </button>

                    <!-- 底部控制栏 -->
                    <div class="video-controls" id="videoControls">
                        <button class="ctrl-btn" id="ctrlPlayBtn" aria-label="播放/暂停">
                            <svg viewBox="0 0 24 24">
                                <polygon points="5,3 19,12 5,21" />
                            </svg>
                        </button>
                        <div class="progress-bar" id="progressBar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                    </div>

                    <!-- 全屏提示 -->
                    <span class="fullscreen-hint">⛶ 双击全屏</span>

                    <!-- 错误提示 -->
                    <div class="video-error" id="videoError">⚠️ 视频加载失败，请检查地址</div>
                </div>
            </div>
        </div>

        <!-- ===== 1:00 时间块（占位，可扩展） ===== -->
        <div class="time-block">
            <div class="time-header">
                <h1>1:00</h1>
                <div class="sub-label">待补充 · 敬请期待</div>
            </div>
            <div style="text-align:center; padding:20px 0; color:#7a5a2a; font-family:幼圆; background:rgba(255,255,240,0.4); border-radius:20px;">
                🌸 更多内容即将上线
            </div>
        </div>

    </div>

    <!-- ========================================================== -->
    <!-- JavaScript：视频控制逻辑                                     -->
    <!-- ========================================================== -->
    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const video = document.getElementById('myVideo');
            const container = document.getElementById('videoContainer');
            const playBtn = document.getElementById('playBtn');
            const ctrlPlayBtn = document.getElementById('ctrlPlayBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const timeDisplay = document.getElementById('timeDisplay');
            const errorEl = document.getElementById('videoError');

            // ---------- 状态 ----------
            let isDragging = false;
            let controlsTimeout = null;

            // ---------- 辅助函数 ----------
            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            function updateProgress() {
                if (!isDragging) {
                    const percent = video.duration ? (video.currentTime / video.duration) * 100 : 0;
                    progressFill.style.width = Math.min(percent, 100) + '%';
                }
                const current = formatTime(video.currentTime);
                const total = formatTime(video.duration);
                timeDisplay.textContent = current + ' / ' + total;
            }

            function togglePlay() {
                if (video.paused) {
                    video.play().catch(function(err) {
                        console.warn('播放失败:', err);
                    });
                } else {
                    video.pause();
                }
            }

            function updateUI() {
                const isPaused = video.paused;
                if (isPaused) {
                    playBtn.classList.remove('hidden');
                    ctrlPlayBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <polygon points="5,3 19,12 5,21" />
                        </svg>
                    `;
                    ctrlPlayBtn.setAttribute('aria-label', '播放');
                    container.classList.remove('playing');
                } else {
                    playBtn.classList.add('hidden');
                    ctrlPlayBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <rect x="6" y="4" width="4" height="16" />
                            <rect x="14" y="4" width="4" height="16" />
                        </svg>
                    `;
                    ctrlPlayBtn.setAttribute('aria-label', '暂停');
                    container.classList.add('playing');
                }
            }

            // ---------- 事件绑定 ----------

            // 中央大按钮
            playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePlay();
            });

            // 控制栏小按钮
            ctrlPlayBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                togglePlay();
            });

            // 点击容器（非控制栏区域）
            container.addEventListener('click', function(e) {
                if (e.target.closest('.video-controls') || e.target.closest('.play-btn')) {
                    return;
                }
                togglePlay();
            });

            // 视频事件
            video.addEventListener('play', function() {
                updateUI();
                clearTimeout(controlsTimeout);
            });
            video.addEventListener('pause', function() {
                updateUI();
            });
            video.addEventListener('ended', function() {
                progressFill.style.width = '0%';
                timeDisplay.textContent = '0:00 / ' + formatTime(video.duration);
                updateUI();
                container.classList.remove('playing');
            });

            video.addEventListener('loadedmetadata', function() {
                updateProgress();
                if (video.duration && isFinite(video.duration)) {
                    timeDisplay.textContent = '0:00 / ' + formatTime(video.duration);
                }
                errorEl.classList.remove('show');
            });

            video.addEventListener('timeupdate', function() {
                if (!isDragging) {
                    updateProgress();
                }
            });

            // 进度条点击
            progressBar.addEventListener('click', function(e) {
                const rect = progressBar.getBoundingClientRect();
                let percent = (e.clientX - rect.left) / rect.width;
                percent = Math.min(Math.max(percent, 0), 1);
                if (video.duration && isFinite(video.duration)) {
                    video.currentTime = percent * video.duration;
                    updateProgress();
                }
            });

            // 进度条拖拽（鼠标）
            progressBar.addEventListener('mousedown', function(e) {
                isDragging = true;
                document.body.style.userSelect = 'none';
                const rect = progressBar.getBoundingClientRect();
                let percent = (e.clientX - rect.left) / rect.width;
                percent = Math.min(Math.max(percent, 0), 1);
                if (video.duration && isFinite(video.duration)) {
                    video.currentTime = percent * video.duration;
                    progressFill.style.width = percent * 100 + '%';
                }
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                const rect = progressBar.getBoundingClientRect();
                let percent = (e.clientX - rect.left) / rect.width;
                percent = Math.min(Math.max(percent, 0), 1);
                if (video.duration && isFinite(video.duration)) {
                    video.currentTime = percent * video.duration;
                    progressFill.style.width = percent * 100 + '%';
                }
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            });

            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.userSelect = '';
                    updateProgress();
                }
            });

            // 进度条拖拽（触摸）
            progressBar.addEventListener('touchstart', function(e) {
                e.preventDefault();
                isDragging = true;
                const touch = e.touches[0];
                const rect = progressBar.getBoundingClientRect();
                let percent = (touch.clientX - rect.left) / rect.width;
                percent = Math.min(Math.max(percent, 0), 1);
                if (video.duration && isFinite(video.duration)) {
                    video.currentTime = percent * video.duration;
                    progressFill.style.width = percent * 100 + '%';
                }
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (!isDragging) return;
                const touch = e.touches[0];
                const rect = progressBar.getBoundingClientRect();
                let percent = (touch.clientX - rect.left) / rect.width;
                percent = Math.min(Math.max(percent, 0), 1);
                if (video.duration && isFinite(video.duration)) {
                    video.currentTime = percent * video.duration;
                    progressFill.style.width = percent * 100 + '%';
                }
                timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
            }, { passive: true });

            document.addEventListener('touchend', function() {
                if (isDragging) {
                    isDragging = false;
                    updateProgress();
                }
            });

            // 双击全屏
            container.addEventListener('dblclick', function() {
                if (video.requestFullscreen) {
                    video.requestFullscreen().catch(function() {});
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                }
            });

            // 键盘空格
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    togglePlay();
                }
            });

            // 视频加载错误
            video.addEventListener('error', function() {
                errorEl.classList.add('show');
                console.warn('视频加载失败，请检查 src 地址。');
            });

            // ---------- 初始化 ----------
            updateUI();
            if (video.readyState >= 1) {
                updateProgress();
            } else {
                timeDisplay.textContent = '0:00 / 0:00';
            }

            console.log('✅ 视频播放器已初始化 (企划嵌入版)');
        })();
    </script>

</body>

</html>
